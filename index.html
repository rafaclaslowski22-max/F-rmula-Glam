    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        display: ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        girl: {
                            pink: '#FF69B4', // Hot Pink
                            lightPink: '#FFB6C1', // Light Pink
                            red: '#FF0035', // Vibrant Red
                            bg: '#FFF0F5', // Lavender Blush

    <style>
        body {
            /* Fundo gradiente super charmoso */
            background: linear-gradient(135deg, #FFF0F5 0%, #FFC0CB 100%);
            color: #4A0E4E; /* Roxo escuro para contraste de leitura */
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* Efeito Glitter Rosa */
        #glitter-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            border-radius: 50%;
            animation: floatTwinkle linear infinite;
            filter: blur(1px);
        }

        @keyframes floatTwinkle {
            0% { opacity: 0; transform: translateY(0) scale(0); }
            50% { opacity: 0.8; transform: translateY(-20px) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(0); }
        }

        /* Glassmorphism Cards */
        .girly-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem; /* Cantos bem arredondados */
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.1);
            transition: all 0.3s ease;
        }

        .girly-card:hover {
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.2);
            transform: translateY(-2px);
        }

        /* Scrollbar fofa */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FFB6C1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #FF69B4; }

        /* Jogo Rosa */
        #gameCanvas {
            background-color: #FFF0F5;
            border: 4px solid #FF69B4;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            touch-action: none; 
        }
    </style>
</head>

        // --- STREAMING_CHUNK:Criando o efeito de brilho e estrelas ---
        function createGlitter() {
            const container = document.getElementById('glitter-container');
            const colors = ['#FF69B4', '#FFB6C1', '#FFFFFF', '#FF1493'];
            const numParticles = 80;

            for (let i = 0; i < numParticles; i++) {
                let particle = document.createElement('div');
                particle.classList.add('sparkle');
                
                let size = Math.random() * 4 + 2; 
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 ${size}px ${particle.style.backgroundColor}`;
                
                let duration = Math.random() * 3 + 2; 
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;

                container.appendChild(particle);
            }
        }
        createGlitter();

                                    </div>
                                    <h3 class="text-xs font-display font-bold leading-tight ${isUnlocked ? 'text-gray-800' : 'text-gray-400'}">${s.driver}</h3>
                                    <span class="text-[10px] ${isUnlocked ? 'text-girl-pink' : 'text-gray-400'} mt-1 font-semibold uppercase tracking-wider">${s.team}</span>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    break;
                case 'game':
                    html = `
                        <div class="flex flex-col items-center justify-center w-full h-full relative">
                            <div class="w-full flex justify-between items-center mb-4 px-4">
                                <h2 class="text-2xl font-display font-bold text-girl-pink">CORRIDA GLAMOUROSA 💋</h2>
                                <div class="text-lg font-bold bg-white px-4 py-2 rounded-full shadow-sm text-gray-700">
                                    Pontos: <span id="scoreDisplay" class="text-girl-red font-display text-xl">0</span>
                                </div>
                            </div>
                            <div class="relative w-full flex justify-center max-w-sm">
                                <canvas id="gameCanvas" width="340" height="480"></canvas>
                                <div id="gameOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-white/80 backdrop-blur-sm rounded-xl">
                                    <h3 class="text-3xl font-display font-bold text-girl-red mb-2 text-center" id="gameOverText">PRONTA PARA ACELERAR?</h3>
                                    <p class="text-gray-500 text-sm mb-6 px-4 text-center">Desvie dos obstáculos vermelhos e mostre quem manda na pista!</p>
                                    <button onclick="startGame()" class="px-8 py-3 bg-gradient-to-r from-girl-pink to-girl-red text-white font-bold rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all">
                                        COMEÇAR JOGO
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    contentArea.innerHTML = html;
                    initGameSetup();
                    return; 
            }
            contentArea.innerHTML = html;
        }

        // --- STREAMING_CHUNK:Sistema de Pesquisa Inteligente ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            if(term.length === 0) { renderContent('home'); return; }

            let resultsHTML = `<h2 class="text-2xl font-display font-bold mb-6 text-girl-pink border-b border-pink-200 pb-2">Pesquisando: "${term}"</h2>`;
            let found = false;

            const gossipRes = db.gossip.filter(g => g.title.toLowerCase().includes(term) || g.text.toLowerCase().includes(term));
            if (gossipRes.length > 0) {
                found = true;
                resultsHTML += `<h3 class="text-lg text-girl-red font-bold mt-4 mb-2"><i class="fa-solid fa-gem"></i> Nas Fofocas</h3>`;
                gossipRes.forEach(g => {
                    resultsHTML += `<div class="p-4 bg-white rounded-xl shadow-sm mb-3 border border-pink-50"><span class="font-bold text-gray-800">${g.title}:</span> <span class="text-gray-600 text-sm">${g.text}</span></div>`;
                });
            }

            const driversRes = db.standings.filter(s => s.driver.toLowerCase().includes(term) || s.team.toLowerCase().includes(term));
            if (driversRes.length > 0) {
                found = true;
                resultsHTML += `<h3 class="text-lg text-girl-red font-bold mt-6 mb-2"><i class="fa-solid fa-crown"></i> Nos Pilotos</h3>`;
                driversRes.forEach(s => {
                    resultsHTML += `<div class="p-4 bg-white rounded-xl shadow-sm mb-3 flex items-center gap-3 border border-pink-50">
                        <div class="w-10 h-10 bg-pink-50 rounded-full flex items-center justify-center overflow-hidden shrink-0">
                            <img src="${s.img}" class="w-12 h-12 transform translate-y-1"> 
                        </div>
                        <span class="font-bold text-gray-800">${s.driver} <span class="text-xs text-gray-400 font-normal">(${s.team})</span></span> 
                        <span class="ml-auto text-girl-pink font-bold">${s.points} Pts</span>
                    </div>`;
                });
            }

            if (!found) {
                resultsHTML += `<div class="text-gray-400 text-center mt-10"><i class="fa-solid fa-face-sad-tear text-4xl mb-4 text-pink-200"></i><br>Oops! Nenhuma fofoca ou piloto encontrado com esse nome.</div>`;
            }

            contentArea.innerHTML = resultsHTML;
        });

        // --- STREAMING_CHUNK:Minigame com Física e Desenho ---
        let canvas, ctx;
        let car, obstacles, score, gameSpeed, frameCount, isGameOver;
        let keys = { ArrowLeft: false, ArrowRight: false };

        // Variáveis da Coleção
        let unlockedDrivers = [];
        let nextUnlockScore = 200;

        function showUnlockNotification(driver) {
            const notif = document.getElementById('unlockNotification');
            document.getElementById('unlockImg').src = driver.img;
            document.getElementById('unlockName').innerText = driver.driver;
            
            notif.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            notif.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                notif.classList.remove('opacity-100', 'translate-y-0');
                notif.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            }, 4000);
        }

        function initGameSetup() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            
            window.addEventListener('keydown', e => {
                if(e.code === 'ArrowLeft' || e.code === 'ArrowRight') keys[e.code] = true;
            });
            window.addEventListener('keyup', e => {
                if(e.code === 'ArrowLeft' || e.code === 'ArrowRight') keys[e.code] = false;
            });
        }

        function handleTouch(e) {
            e.preventDefault(); 
            const touchX = e.touches[0].clientX;
            const rect = canvas.getBoundingClientRect();
            const canvasX = touchX - rect.left;
            
            if(canvasX > 0 && canvasX < canvas.width) {
                car.x = canvasX - (car.w / 2);
            }
        }

        function startGame() {
            document.getElementById('gameOverlay').style.display = 'none';
            // Carro Rosa Choque
            car = { x: 155, y: 380, w: 30, h: 60, color: '#FF69B4' }; 
            obstacles = [];
            score = 0;
            gameSpeed = 4;
            frameCount = 0;
            isGameOver = false;
            nextUnlockScore = 200; // Resetar meta de desbloqueio para a nova corrida
            document.getElementById('scoreDisplay').innerText = score;
            
            if(currentGameInterval) cancelAnimationFrame(currentGameInterval);
            gameLoop();
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('gameOverlay').style.display = 'flex';
            document.getElementById('gameOverText').innerHTML = `BATEU! 💔<br><span class="text-xl text-gray-700 mt-2 block font-sans">Seu estilo rendeu: ${Math.floor(score)} pts</span>`;
        }

        function updateGame() {
            if (keys.ArrowLeft && car.x > 0) car.x -= 6;
            if (keys.ArrowRight && car.x < canvas.width - car.w) car.x += 6;

            frameCount++;
            if (frameCount % Math.max(30, 80 - Math.floor(score/10)) === 0) {
                let w = Math.random() * 30 + 20; 
                let h = 20; 
                let x = Math.random() * (canvas.width - w);
                // Obstáculos em Vermelho ou Roxo Escuro
                let color = Math.random() > 0.5 ? '#FF0035' : '#4A0E4E'; 
                obstacles.push({ x, y: -20, w, h, color });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                if (car.x < obs.x + obs.w &&
                    car.x + car.w > obs.x &&
                    car.y < obs.y + obs.h &&
                    car.h + car.y > obs.y) {
                    gameOver();
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('scoreDisplay').innerText = score;
                    if(score % 100 === 0) gameSpeed += 0.5; 

                    // Lógica de ganhar novo boneco
                    if (score >= nextUnlockScore) {
                        nextUnlockScore += 200; // Define a meta do próximo boneco
                        const available = db.standings.filter(s => !unlockedDrivers.includes(s.driver));
                        
                        if (available.length > 0) {
                            const randomDriver = available[Math.floor(Math.random() * available.length)];
                            unlockedDrivers.push(randomDriver.driver);
                            showUnlockNotification(randomDriver);
                        }
                    }
                }
            }
        }

        function drawGame() {
            // Pista Fundo
            ctx.fillStyle = '#FFF0F5'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linhas da pista cor-de-rosa suave
            ctx.strokeStyle = '#FFB6C1';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 4;
            ctx.lineDashOffset = -frameCount * gameSpeed;
            
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Desenhando o Carro Rosa
            ctx.fillStyle = car.color;
            ctx.shadowColor = 'rgba(255, 105, 180, 0.5)';
            ctx.shadowBlur = 10;
            
            // Corpo do carro com bordas arredondadas
            ctx.beginPath();
            ctx.roundRect(car.x, car.y, car.w, car.h, 5);
            ctx.fill();
            
            // Pneus cinza escuro
            ctx.fillStyle = '#333';
            ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.roundRect(car.x - 4, car.y + 10, 4, 15, 2); ctx.fill(); 
            ctx.beginPath(); ctx.roundRect(car.x + car.w, car.y + 10, 4, 15, 2); ctx.fill(); 
            ctx.beginPath(); ctx.roundRect(car.x - 4, car.y + 40, 4, 15, 2); ctx.fill(); 
            ctx.beginPath(); ctx.roundRect(car.x + car.w, car.y + 40, 4, 15, 2); ctx.fill(); 

            // Obstáculos
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.shadowColor = obs.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 4);
                ctx.fill();
            });
            ctx.shadowBlur = 0; 
        }

        function gameLoop() {
            if (isGameOver) return;
            updateGame();
            drawGame();
            currentGameInterval = requestAnimationFrame(gameLoop);
        }

        // Inicializar na Home
        renderContent('home');

    </script>
</body>
</html>
